{% extends "base.html" %}

{% block content %}
<div class="page">

  <div class="page-header">
    <h1 class="page-title">Workers</h1>
    <a class="btn btn-primary" href="{% url 'task:worker-create' %}">+ New worker</a>
  </div>

  <div class="worker-grid">
    {% for worker in worker_list %}
    <div class="worker-card">
      <span class="worker-card__username">{{ worker.username }}</span>
      <span class="worker-card__position">{{ worker.position }}</span>
      <a class="worker-card__link" href="{% url 'task:worker-detail' pk=worker.id %}">View profile</a>
    </div>
    {% empty %}
    <div class="worker-empty empty-state"><h3>No workers yet.</h3></div>
    {% endfor %}
  </div>

</div>
{% endblock %}
