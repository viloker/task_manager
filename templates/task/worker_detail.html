{% extends "base.html" %}

{% block content %}
<div class="page">
  <div class="worker-detail">

    <div class="worker-detail__header">
      <div>
        <h2 class="worker-detail__title">{{ worker.username }}</h2>
        <p class="worker-detail__subtitle">{{ worker.first_name }} {{ worker.last_name }}</p>
      </div>
      <span class="badge badge-primary">{{ worker.position }}</span>
    </div>

    <div class="worker-detail__body">
      <div class="worker-detail__field">
        <span class="worker-detail__label">Tasks</span>
        <div class="worker-tasks">
          {% for task in worker.tasks.all %}
            <a href="{% url 'task:task-detail' task.id %}" class="worker-task-chip">{{ task.name }}</a>
          {% empty %}
            <span class="worker-no-tasks">No active tasks.</span>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="worker-detail__actions">
      <a class="btn btn-outline" href="{% url 'task:worker-update' pk=worker.id %}">Edit</a>
      <a class="btn btn-danger-outline" href="{% url 'task:worker-delete' pk=worker.id %}">Delete</a>
    </div>

  </div>
</div>
{% endblock %}
