{% extends "base.html" %}

{% block content %}
<div class="page">

  <div class="page-header">
    <h1 class="page-title">My Tasks</h1>
  </div>

  <div class="task-list">
    {% for task in task_list %}
    <div class="task-item">
      <a class="task-item__name" href="{% url 'task:task-detail' pk=task.id %}">{{ task.name }}</a>

      {% if task.is_completed %}
        <span class="badge badge-success task-item__status">Completed</span>
      {% else %}
        <span class="badge badge-neutral task-item__status">Not completed</span>
      {% endif %}

      <span class="badge badge-primary task-item__priority">{{ task.priority }}</span>
      <span class="task-item__deadline">{{ task.deadline }}</span>
    </div>
    {% empty %}
    <div class="empty-state"><h3>You don't have any tasks yet.</h3></div>
    {% endfor %}
  </div>

</div>
{% endblock %}
