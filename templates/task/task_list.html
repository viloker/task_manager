{% extends "base.html" %}

{% block content %}
<div class="page">

  <div class="page-header">
    <h1 class="page-title">All Tasks</h1>
    <a class="btn btn-primary" href="{% url 'task:task-create' %}">+ New task</a>
  </div>

  {% include "includes/task_filters.html" %}

  <div class="task-list">
    {% for task in task_list %}
    <div class="task-item">
      <a class="task-item__name" href="{% url 'task:task-detail' pk=task.id %}">{{ task.name }}</a>

      {% include "includes/task_completed.html" %}

      <span class="badge badge-primary task-item__priority">{{ task.priority }}</span>
      <span class="task-item__deadline">{{ task.deadline }}</span>
    </div>
    {% empty %}
    <div class="empty-state"><h3>No tasks found.</h3></div>
    {% endfor %}
  </div>

</div>
{% endblock %}
