{% extends "base.html" %}

{% block content %}
<div class="form-page">
  <div class="delete-card">
    <h1>Delete worker <span class="delete-target">"{{worker.username}}"</span>?</h1>
    <p class="delete-hint">This action cannot be undone.</p>
    <div class="delete-actions">
      <form method="post">
        {% csrf_token %}
        <input type="submit" value="Yes, delete">
      </form>
      <a class="btn-cancel" href="{% url 'task:worker-list' %}">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
