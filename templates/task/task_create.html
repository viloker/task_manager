{% extends "base.html" %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <h1>{{object|yesno:"Update,Create"}} task</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Save task">
    </form>
  </div>
</div>
{% endblock %}
