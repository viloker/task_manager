<header class="navbar navbar-expand-lg bg-body-tertiary">

  <div class="container-fluid">

    <div class="">

      <h1 class="navbar-brand">
        <a class="btn btn-outline-success" href="{% url 'task:index' %}">Task manager</a>
      </h1>

    </div>

    <div class="mx-auto">

      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link active" href="{% url 'task:my-task' %}">My Tasks</a>
        </li>
        <li>
          <a class="nav-link active" href="{% url 'task:task-list' %}">All Tasks</a>
        </li>
        <li>
          <a class="nav-link active" href="{% url 'task:worker-list' %}">Workers</a>
        </li>
        <li>
          <a class="nav-link active" href="{% url 'task:position-list' %}">Positions</a>
        </li>

      </ul>
    </div>
    {% if search %}
    <div class="">
      <form method="get">
        {{ search.as_p }}
        <input type="submit" value="Search">
      </form>
    </div>
    {% endif %}
    <div>
      <form method="post" action="{% url 'logout' %}?next={{request.path}}">
        {% csrf_token %}
        <input type="submit" value="Logout">
      </form>
    </div>
  </div>
</header>
